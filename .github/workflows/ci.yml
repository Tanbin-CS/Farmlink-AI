name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build static app (repository base path)
        run: npm run build -w frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npm run build -w backend
      - name: Secret scan (source and built bundle)
        run: node scripts/secret-scan.mjs . frontend/dist
      - name: Browser end-to-end checks (guided mode, no paid API calls)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          CI: 'true'
